</a><script>
(() => {
  const toc = document.querySelector(".post-single > .toc");
  const content = document.querySelector(".post-content");

  if (!toc || !content) {
    return;
  }

  const links = Array.from(toc.querySelectorAll('a[href^="#"]'));
  const headings = Array.from(content.querySelectorAll("h1, h2, h3, h4, h5, h6"))
    .filter((heading) => heading.id);

  if (!links.length || !headings.length) {
    return;
  }

  const linkById = new Map(
    links.map((link) => [decodeURIComponent(link.hash.slice(1)), link])
  );

  const setActive = (id) => {
    links.forEach((link) => {
      link.classList.remove("is-active");
      link.removeAttribute("aria-current");
      link.closest("li")?.classList.remove("is-active-item");
    });

    const active = linkById.get(id);
    if (!active) {
      return;
    }

    active.classList.add("is-active");
    active.setAttribute("aria-current", "location");
    active.closest("li")?.classList.add("is-active-item");
  };

  const updateActive = () => {
    const anchorLine = window.scrollY + Math.round(window.innerHeight * 0.28);
    let current = headings[0];

    for (const heading of headings) {
      if (heading.offsetTop <= anchorLine) {
        current = heading;
      } else {
        break;
      }
    }

    setActive(current.id);
  };

  let ticking = false;
  const requestUpdate = () => {
    if (ticking) {
      return;
    }

    ticking = true;
    window.requestAnimationFrame(() => {
      updateActive();
      ticking = false;
    });
  };

  updateActive();
  window.addEventListener("scroll", requestUpdate, { passive: true });
  window.addEventListener("resize", requestUpdate);
})();
</script>


<script>
    let menu = document.getElementById('menu')
    if (menu) {
        menu.scrollLeft = localStorage.getItem("menu-scroll-position");
        menu.onscroll = function () {
            localStorage.setItem("menu-scroll-position", menu.scrollLeft);
        }
    }

    document.querySelectorAll('a[href^="#"]').forEach(anchor => {
        anchor.addEventListener("click", function (e) {
            e.preventDefault();
            var id = this.getAttribute("href").substr(1);
            if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
                document.querySelector(`[id='${decodeURIComponent(id)}']`).scrollIntoView({
                    behavior: "smooth"
                });
            } else {
                document.querySelector(`[id='${decodeURIComponent(id)}']`).scrollIntoView();
            }
            if (id === "top") {
                history.replaceState(null, null, " ");
            } else {
                history.pushState(null, null, `#${id}`);
            }
        });
    });

</script>
<script>
    var mybutton = document.getElementById("top-link");
    window.onscroll = function () {
        if (document.body.scrollTop > 800 || document.documentElement.scrollTop > 800) {
            mybutton.style.visibility = "visible";
            mybutton.style.opacity = "1";
        } else {
            mybutton.style.visibility = "hidden";
            mybutton.style.opacity = "0";
        }
    };

</script>
<script>
    document.getElementById("theme-toggle").addEventListener("click", () => {
        if (document.body.className.includes("dark")) {
            document.body.classList.remove('dark');
            localStorage.setItem("pref-theme", 'light');
        } else {
            document.body.classList.add('dark');
            localStorage.setItem("pref-theme", 'dark');
        }
    })

</script>
